name: publish

# Publishing from a laptop proves who uploaded the package and nothing about
# where the bytes came from. Publishing from here attaches a signed provenance
# attestation binding the tarball to this commit and this run, which anyone can
# verify and which a stolen npm token cannot forge.
#
# Triggered by a GitHub release so the version, the tag and the published
# artifact are the same event. workflow_dispatch is there for a re-run.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  # The whole point. Without id-token, npm has no OIDC identity to sign with
  # and --provenance fails rather than silently publishing unsigned.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      # ci, not install: the committed lockfile is the record of what shipped,
      # and a publish that resolved something different would make it a lie.
      - run: npm ci

      # The gate that already exists, run before the tarball rather than after.
      # It launches the server over stdio, checks the handshake, the tool count
      # and the schemas, and calls the live API. A publish that would ship a
      # broken server fails here instead of on somebody's machine.
      - run: node test-release.mjs

      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
